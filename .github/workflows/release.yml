name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  create:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Read add-on version
        id: version
        run: |
          set -euo pipefail
          V=$(sed -n 's/^version: "\(.*\)"/\1/p' newt/config.yaml)
          if [ -z "$V" ]; then
            echo "::error::Could not read version from newt/config.yaml"
            exit 1
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="v${{ steps.version.outputs.version }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists"
            exit 1
          fi
          gh release create "$TAG" \
            --title "$TAG" \
            --target "${{ github.sha }}" \
            --generate-notes
