name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  create:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Read add-on version
        id: version
        run: |
          set -euo pipefail
          V=$(sed -n 's/^version: "\(.*\)"/\1/p' newt/config.yaml)
          if [ -z "$V" ]; then
            echo "::error::Could not read version from newt/config.yaml"
            exit 1
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Verify version references
        run: |
          set -euo pipefail
          FULL="${{ steps.version.outputs.version }}"
          if ! [[ "$FULL" =~ ^[0-9]+\.[0-9]+\.[0-9]+-[0-9]+$ ]]; then
            echo "::error::config version must be <newt>-<repo>, e.g. 1.11.0-2 (got: $FULL)"
            exit 1
          fi
          NEWT_CONFIG="${FULL%-*}"
          NEWT_DOCKER=$(sed -n 's/^ARG NEWT_VERSION="\(.*\)"/\1/p' newt/Dockerfile)
          if [ -z "$NEWT_DOCKER" ]; then
            echo "::error::Could not read NEWT_VERSION from newt/Dockerfile"
            exit 1
          fi
          if [ "$NEWT_DOCKER" != "$NEWT_CONFIG" ]; then
            echo "::error::NEWT_VERSION in Dockerfile ($NEWT_DOCKER) must match the Newt portion of version in config.yaml ($NEWT_CONFIG from $FULL)"
            exit 1
          fi

      - name: Generate release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ steps.version.outputs.version }}"
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            "/repos/${{ github.repository }}/releases/generate-notes" \
            -f tag_name="$TAG" \
            -f target_commitish="${{ github.sha }}" \
            --jq .body > /tmp/release_notes.md

      - name: Sync CHANGELOG.md
        run: |
          set -euo pipefail
          cp /tmp/release_notes.md newt/CHANGELOG.md

      - name: Commit and push CHANGELOG
        id: push
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add newt/CHANGELOG.md
          if git diff --cached --quiet; then
            echo "No CHANGELOG changes to commit"
          else
            git commit -m "chore(newt): sync changelog for ${{ steps.version.outputs.version }}"
            git push origin "${{ github.ref_name }}"
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GH_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::Set repository secret GH_RELEASE_TOKEN (classic PAT with repo scope, or fine-grained with Contents: Read and write). Required so the published release triggers publish.yml."
            exit 1
          fi
          TAG="${{ steps.version.outputs.version }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists"
            exit 1
          fi
          gh release create "$TAG" \
            --title "$TAG" \
            --target "${{ steps.push.outputs.sha }}" \
            --notes-file /tmp/release_notes.md
